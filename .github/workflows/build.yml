name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --locked
      - name: Build Windows release package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-windows.ps1
      - name: Verify the Windows release CLI
        if: runner.os == 'Windows'
        run: python scripts/smoke-cli.py --cli target/x86_64-pc-windows-msvc/release/wxlocated.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: WxLocated-windows-x64
          path: |
            target/bundle/windows/*.zip
            target/bundle/windows/*.sha256
          if-no-files-found: error
